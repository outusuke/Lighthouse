name: Android Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish the signed APK as a draft GitHub release
        type: boolean
        default: false
      tag:
        description: Release tag, required when creating a release
        type: string

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check keystore secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is empty"; exit 1; }
      - name: Check release tag
        if: inputs.create_release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || { echo "::error::tag is required when create_release is set"; exit 1; }

  generate-port-o2r:
    needs: check-inputs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ git cmake ninja-build lsb-release zlib1g-dev
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-o2r-${{ github.ref }}
      - name: Generate lighthouse.o2r
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          make -C Torch type=release -j3
          rm -rf port_staging
          cp -r port port_staging
          cp -r libultraship/src/fast/shaders port_staging/shaders
          Torch/cmake-build-release/torch pack port_staging lighthouse.o2r o2r
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse.o2r
          path: lighthouse.o2r
          retention-days: 1

  build-apk:
    needs: generate-port-o2r
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3" "ndk;30.0.15729638" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Install Python dependencies
        run: pip install -r libultraship/requirements.txt
      - name: Download lighthouse.o2r
        uses: actions/download-artifact@v4
        with:
          name: lighthouse.o2r
          path: .
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: android/gradlew -p android assembleRelease
      - name: Collect APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK" || (echo "ERROR: APK not found" && exit 1)
          for entry in assets/gamedata.zip assets/gamedata.version \
                       assets/gamecontrollerdb.txt assets/mods/place_mods_here.txt; do
            unzip -Z1 "$APK" | grep -qx "$entry" || (echo "ERROR: $entry missing from the APK" && exit 1)
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" Lighthouse-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-release-apk
          path: Lighthouse-release.apk

  release:
    name: Draft release
    if: inputs.create_release
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lighthouse-release-apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" Lighthouse-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes --draft
